name: HabitTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - HabitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.HabitTracker
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: HabitTracker/HabitTracker.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Habit Tracker
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HabitTrackerWidget
        embed: true
  HabitTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - HabitTrackerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.HabitTracker.widget
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: HabitTrackerWidget/HabitTrackerWidget.entitlements
        INFOPLIST_FILE: HabitTrackerWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
